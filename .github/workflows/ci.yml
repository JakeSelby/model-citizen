name: ci

on:
  push:
    branches: [main]
  pull_request:
  # A queued pull request is tested again on the queue's merge commit; without this trigger the
  # required checks never report there and the queue waits for them forever.
  merge_group:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Personal strings and secret patterns
        run: python3 bin/harness lint

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Advisory: this job is deliberately absent from the branch ruleset's required checks
      # while it is decided whether a red tier may block a freeze. The credential probe is left
      # out because this runner holds no client credential; it belongs on the host that will run
      # a qualification round. It runs the runner's system Python, as `test` does; `test-py39`
      # holds the 3.9 floor.
      - name: Deterministic pre-qualification checks
        run: python3 scripts/smoke_tier.py --skip credentials

  corpus:
    name: corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Beside `test` rather than inside it: the floor is a claim about the detectors, and a
      # red row here should read as "a detector got worse", not as a unit test failing.
      # Whether it blocks a merge is the branch ruleset's call, not this file's.
      - name: Detector precision and recall over both labelled corpora
        run: python3 scripts/detector_corpus.py --floor 0.9

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The floor parse runs under a real 3.9: a newer parser honours `feature_version` only in
      # part (3.12's f-string grammar ignores it). The interpreter stays off PATH, so the steps
      # below still run the runner's system Python.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: floor
        with:
          python-version: "3.9"
          update-environment: false
      - name: Syntax at the Python 3.9 floor
        env:
          FLOOR_PYTHON: ${{ steps.floor.outputs.python-path }}
        run: '"$FLOOR_PYTHON" -m unittest tests.test_python_floor -v'
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Static context figure has not grown unexplained
        run: python3 scripts/cost_bench.py static --check
      - name: Audit BMad issue mapping
        run: python3 scripts/bmad_issue_sync.py audit
      - name: Sync dry run against the example config
        run: |
          mkdir -p ~/.config/agent-harness
          cp config.example.json ~/.config/agent-harness/config.json
          python3 bin/harness sync --dry-run

  test-py39:
    name: test-py39
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The suite under the 3.9 floor, beside `test` rather than inside it, so a 3.9-only failure
      # reads as a floor break. `test` already fails on 3.9-incompatible syntax through
      # tests/test_python_floor.py; this job adds the stdlib and runtime behaviour a parse cannot
      # see. Whether it blocks a merge is the branch ruleset's call, not this file's.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"
      - name: Unit tests under Python 3.9
        run: python -m unittest discover -s tests -v
