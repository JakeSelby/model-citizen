name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  qualified-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Install pinned npm for Studio preflight
        run: |
          required_npm=$(node -p "require('./studio/package.json').packageManager.split('@')[1]")
          npm install --global "npm@$required_npm"
          test "$(npm --version)" = "$required_npm"
      - name: Verify release identity and native qualification
        run: |
          test "$GITHUB_REF_NAME" = "v$(tr -d '\n' < VERSION)"
          python3 scripts/release_preflight.py
      - name: Verify source gates
        run: |
          python3 bin/harness lint
          python3 -m unittest discover -s tests
          python3 bin/harness generate --check
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_notes.py > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Model Citizen $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"

  advance-stable:
    needs: qualified-release
    runs-on: ubuntu-latest
    # A refused push must not turn a published release red; the release procedure runs `--check`.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Advance stable to the release
        run: python3 scripts/advance_stable.py "$GITHUB_REF_NAME"
