name: studio-qualification

on:
  push:
    branches: [main, feature/v0.18.0-studio]
  pull_request:
  merge_group:
  # Release records are made by running this on the frozen commit; see docs/releasing.md.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    name: studio-lifecycle-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The hosted macOS image ships Chrome on its own schedule, often a major behind stable.
      # Record the image's version, then qualify Google's current stable build instead.
      - name: Install current stable Chrome on macOS
        if: runner.os == 'macOS'
        run: |
          app="/Applications/Google Chrome.app"
          echo "HARNESS_STUDIO_IMAGE_CHROME=$("$app/Contents/MacOS/Google Chrome" --version | xargs)" >> "$GITHUB_ENV"
          dmg="$RUNNER_TEMP/googlechrome.dmg"
          curl --fail --location --silent --show-error --output "$dmg" \
            https://dl.google.com/chrome/mac/universal/stable/GGRO/googlechrome.dmg
          echo "HARNESS_STUDIO_CHROME_INSTALLER_SHA256=$(shasum -a 256 "$dmg" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          mount="$(hdiutil attach -nobrowse -readonly "$dmg" | awk -F'\t' '/\/Volumes\//{print $NF}')"
          # Verified against Apple's chain with Google's developer team as the leaf, not read
          # back from the signature's own display fields.
          codesign --verify --deep --strict \
            -R='anchor apple generic and certificate leaf[subject.OU] = "EQHXZ8M8AV"' \
            "$mount/Google Chrome.app"
          sudo rm -rf "$app"
          sudo ditto "$mount/Google Chrome.app" "$app"
          hdiutil detach "$mount"
          "$app/Contents/MacOS/Google Chrome" --version
      # Stable Chrome moving past the pin is a pin to update, not a Studio failure: say so plainly.
      - name: Check the Chrome pin
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import studio_lifecycle_acceptance as qualification
          try:
              print(qualification.observed_chrome(qualification.ROOT, qualification.chrome()))
          except AssertionError as error:
              title = "Studio Chrome pin is behind" if "pin is behind" in str(error) else "Studio Chrome"
              print("::error title={}::{}".format(title, error))
              raise SystemExit(1)
          PY
      - name: Qualify lifecycle, security and Chrome flows
        run: |
          python3 scripts/studio_lifecycle_acceptance.py \
            --output "$RUNNER_TEMP/studio-lifecycle.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          record = json.loads((Path(os.environ["RUNNER_TEMP"]) / "studio-lifecycle.json").read_text())
          assert all(case["status"] == "passed" for case in record["cases"])
          print(json.dumps(record, indent=2, sort_keys=True))
          PY
