name: studio-e2e

on:
  push:
    branches: [main, feature/v0.18.0-studio]
  pull_request:
  merge_group:

permissions:
  contents: read

# A newer push to the same pull request supersedes a run still in progress. Pushes to a branch
# queue instead, so every commit that lands on main keeps its own result.
concurrency:
  group: studio-e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The Studio's six main flows end to end in headless Chrome, and its performance budgets,
  # against a fixture home with no network and no model calls (AH-S316). Whether it blocks a
  # merge is the branch ruleset's call, not this file's.
  e2e:
    name: studio-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The flows serve a clone of this commit, and its lint reads released commits.
          fetch-depth: 0
      # The runner image's preinstalled Google Chrome stable, the same browser the
      # studio-lifecycle job qualifies; nothing is downloaded. A missing browser fails here.
      - name: Chrome is present
        run: google-chrome --version
      - name: Bundle size budgets
        run: python3 scripts/studio_budgets.py bundle
      - name: End-to-end flows and live budgets
        working-directory: tests
        env:
          # Opts in to the checks the plain unit-suite runs skip, and makes a missing Chrome
          # fail every check instead of skipping it.
          STUDIO_E2E: "1"
        run: python3 -m unittest -v test_e2e_studio_flows test_e2e_studio_budgets
