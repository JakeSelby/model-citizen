# The labels for this repository's own corpus: the thirteen detectors in
# `claude/hooks/rule-detectors.py` that are about these rules. The six the vendored engine
# ships are labelled by the corpus inside the wheel, and `scripts/detector_corpus.py` scores
# both, so every detector `harness usage --rules` reports has a precision and a recall.
#
# The file is the same shape as the wheel's `ruleprobe/corpus/labels.yaml`. One entry per
# labelled event: `at` is the key a hit carries - the turn, a colon, and the tool use id, or
# `-` when the hit is on the message rather than on a tool use. `fire` is every detector that
# should fire there and is the whole truth about that event, so a hit at a key whose `fire`
# does not name the detector is a false positive. `near` marks a deliberate near-miss and is
# what the negative count counts. An event with neither is unremarkable.
#
# The sessions are written by `build_sessions.py` beside this file; change a case there,
# re-run it, and commit what it writes. Every one is synthetic: no real transcript content,
# no home paths, no personal names, no live credentials.

version: 1

# A detector measured under the floor, with the score it measured and the floor it was
# measured against. The floor is not lowered for it: the entry says what is known to be wrong,
# and `scripts/detector_corpus.py` fails again the moment the measurement moves or the detector
# climbs above the floor its entry names. Run at a lower floor the entry is simply dormant.
known_below_floor: []

sessions:

  - session: briefs-word-cap.jsonl
    note: five Agent briefs the model wrote with no word cap, and five that carry one
    labels:
      - at: "1:tu-b1"
        fire: [transcript-hygiene/model-wrote-no-cap]
        note: an uncapped brief to an agent whose own definition carries no cap
      - at: "1:tu-n1"
        near: [transcript-hygiene/model-wrote-no-cap]
        note: a capped agent, which needs no cap in the brief
      - at: "2:tu-b2"
        fire: [transcript-hygiene/model-wrote-no-cap]
        note: a brief saying only to keep it short states no cap, because a cap carries a number
      - at: "2:tu-n2"
        near: [transcript-hygiene/model-wrote-no-cap]
      - at: "3:tu-b3"
        fire: [transcript-hygiene/model-wrote-no-cap]
        note: a paragraph count is a bound on shape, not the word cap the rule asks for
      - at: "3:tu-n3"
        near: [transcript-hygiene/model-wrote-no-cap]
      - at: "4:tu-b4"
        fire: [transcript-hygiene/model-wrote-no-cap]
      - at: "4:tu-n4"
        near: [transcript-hygiene/model-wrote-no-cap]
      - at: "5:tu-b5"
        fire: [transcript-hygiene/model-wrote-no-cap]
      - at: "5:tu-n5"
        near: [transcript-hygiene/model-wrote-no-cap]

